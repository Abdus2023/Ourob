[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ourob"
version = "0.1.0"
description = "An autonomous-engineering runtime whose source, skills, policies, state model, verification machinery and bootstrap live inside the repository it engineers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "ruff>=0.5"]

[project.scripts]
ourob = "ourob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = [
    # Handlers that fail closed on purpose: a crashing gate or policy must
    # become a denial, not a stack trace.
    "BLE001",
    # Every subprocess call inspects the return code explicitly; `check=True`
    # would hide the output the gate needs to report.
    "PLW1510",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
